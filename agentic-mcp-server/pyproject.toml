[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-oracle-mcp-server"
version = "0.1.0"
description = "MCP server exposing safe Oracle database tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "oracledb",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
agentic-oracle-mcp = "agentic_oracle_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_oracle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
