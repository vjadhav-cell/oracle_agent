version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    environment:
      - MCP_TRANSPORT=http
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - MCP_API_KEY=dev-mcp-key
      # Add your service credentials here (or use .env file)
      # - JIRA_BASE=https://your-jira.atlassian.net
      # - JIRA_EMAIL=your-email@example.com
      # - JIRA_API_TOKEN=your-jira-token
      # - SLACK_BOT_TOKEN=xoxb-your-slack-token
      # - GCP_SA_JSON={"type": "service_account", ...}
      # - GRAFANA_BASE_URL=https://your-grafana.com
      # - GRAFANA_API_KEY=your-grafana-api-key
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/resources/health/check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
