version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    environment:
      - MCP_TRANSPORT=http
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - MCP_API_KEY=dev-mcp-key
      - ORACLE_ENABLED=${ORACLE_ENABLED:-true}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-}
      - QUERY_LIMIT_SIZE=${QUERY_LIMIT_SIZE:-50}
      - TABLE_WHITE_LIST=${TABLE_WHITE_LIST:-}
      - COLUMN_WHITE_LIST=${COLUMN_WHITE_LIST:-}
      - ORACLE_POOL_SIZE=${ORACLE_POOL_SIZE:-5}
      - ORACLE_MAX_OVERFLOW=${ORACLE_MAX_OVERFLOW:-10}
      - ORACLE_POOL_RECYCLE=${ORACLE_POOL_RECYCLE:-3600}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/resources/health/check', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
